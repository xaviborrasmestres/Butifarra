<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Butifarra</title>
<style>
:root{--felt:#1f5c3a;--felt2:#143d27;--card:#fbf6e6;--ink:#222;--gold:#ffd54a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0b2216;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 35%,var(--felt),var(--felt2));padding:8px 8px 14px}
body{background:#0b2216 radial-gradient(var(--b1),var(--b2))}
.senyera{height:9px;border-radius:5px;margin-bottom:6px;background:repeating-linear-gradient(90deg,#f6c500 0 11.11%,#c8102e 11.11% 22.22%);background-size:100% 100%;box-shadow:0 1px 3px #0008}
#frame{margin:12px 3px 14px;border:13px solid transparent;border-radius:20px;padding:4px 4px 2px;background:var(--noise) padding-box,radial-gradient(ellipse at 50% 42%,var(--f1) 0,var(--f2) 55%,var(--f3) 100%) padding-box,var(--tile) border-box;box-shadow:0 0 0 3px #d8b23a,0 0 0 4px #5a3d00,0 0 0 8px #4a2d12,0 0 0 9px #2a1608,0 8px 18px #000c,inset 0 0 0 2px #d8b23a55,inset 0 0 26px #000a}
.med{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.av{width:40px;height:40px;filter:drop-shadow(0 2px 2px #0008)}
.seat{display:flex;flex-direction:column;align-items:center}
.seat.top{flex-direction:row}
.seat.top .av{width:38px;height:38px}
.ttl2{font-family:Georgia,serif;font-style:italic;font-size:19px;color:#ffe08a;text-shadow:0 2px 0 #7a1010,0 3px 6px #000}
#frieze{display:flex;justify-content:space-around;align-items:center;padding:3px 6px 1px;border-top:1px dashed #ffffff30;margin-top:2px}
#frieze svg{height:36px;width:auto;filter:drop-shadow(0 1px 1px #0008)}
.flyback{position:fixed;width:34px;height:48px;border-radius:5px;border:1px solid #fff;pointer-events:none;z-index:8;background:repeating-linear-gradient(90deg,#f6c500 0 4px,#c8102e 4px 8px);box-shadow:0 2px 4px #0008;opacity:0}
@keyframes dealin{from{opacity:0;transform:translateY(-80px) scale(.45) rotate(-25deg)}to{opacity:1;transform:none}}
.dealin{animation:dealin .42s cubic-bezier(.2,.9,.3,1.15) backwards}
header{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px}
.sc{background:#0006;border-radius:10px;padding:5px 10px;text-align:center;line-height:1.15}
.sc b{display:block;font-size:20px}
.mid{flex:1;text-align:center;font-size:13px}
.mid .tr{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:15px}
.mid svg{width:20px;height:20px}
.badge{background:var(--gold);color:#000;border-radius:8px;padding:0 6px;font-size:12px;font-weight:800;margin-left:4px}
.ibtn{background:#0006;border:0;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px}
#table{display:grid;grid-template-columns:62px 1fr 62px;grid-template-rows:auto 252px;gap:4px;margin-top:2px}
.seat{text-align:center;font-size:12px;opacity:.9}
.seat .mini{box-shadow:0 0 0 2px #2a1a0a;width:34px;margin:2px auto 0;aspect-ratio:5/7;border-radius:5px;border:1px solid #fff;background:repeating-linear-gradient(90deg,#f6c500 0 4px,#c8102e 4px 8px);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;text-shadow:0 1px 2px #000}
.seat.turn .nm2{color:var(--gold);font-weight:800}
.seat.top{grid-column:1/4;display:flex;align-items:center;justify-content:center;gap:8px}
.seat.top .mini{margin:0}
.seat.left,.seat.right{align-self:center}
#center{position:relative}
.slot{position:absolute;width:72px}
#c0{bottom:0;left:50%;transform:translateX(-50%)}
#c2{top:0;left:50%;transform:translateX(-50%)}
#c1{right:0;top:80px}
#c3{left:0;top:80px}
.card{position:relative;border-radius:8px;box-shadow:0 1px 3px #0007;aspect-ratio:5/7;user-select:none;width:100%;line-height:0}
.card svg{width:100%;height:100%;display:block}
.card.t{box-shadow:0 0 0 2px #e0a800,0 1px 3px #0007}
.card.legal{outline:3px solid var(--gold);transform:translateY(-6px);cursor:pointer}
.card.dim{opacity:.4}
.card.win{box-shadow:0 0 0 3px #7cff9e,0 0 12px #7cff9e}
#msg{min-height:34px;text-align:center;font-size:14px;margin:6px 0 2px;padding:0 4px}
#actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:46px;margin-bottom:4px}
#actions .ttl{width:100%;text-align:center;font-size:13px;opacity:.85}
.btn{background:var(--gold);color:#000;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.btn.sec{background:#ffffff26;color:#fff}
.btn svg{width:20px;height:20px}
#hand{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:10px 2px 2px}
#pv{position:fixed;display:none;z-index:7;pointer-events:auto;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 8px 14px #000c);animation:pvin .18s ease-out}
#pv svg{width:100%;display:block}
#pv .hint{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);white-space:nowrap;background:var(--gold);color:#000;font-weight:800;font-size:13px;line-height:1;padding:8px 14px;border-radius:14px;box-shadow:0 3px 8px #000a}
#pv .hint.no{background:#ddd;color:#555}
.card{touch-action:manipulation}
@keyframes pvin{from{opacity:0;transform:translateY(12px) scale(.85)}}
.card.sel{transform:translateY(-12px) scale(1.06);z-index:2;box-shadow:0 0 0 3px #fff,0 6px 12px #000a}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#ov .box{background:#fbf6e6;color:#222;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:88vh;overflow:auto;font-size:14px;line-height:1.45}
#ov h2{margin:0 0 8px;font-size:20px}
#ov ul{padding-left:18px;margin:6px 0}
#ov .btn{margin:12px auto 0}

body,body[data-felt=verd]{--f1:#2f8a58;--f2:#1f5c3a;--f3:#10331f;--b1:#12361f;--b2:#0b2216}
body[data-felt=blau]{--f1:#3a6cae;--f2:#234a80;--f3:#112849;--b1:#14284a;--b2:#0a1426}
body[data-felt=granat]{--f1:#a83a52;--f2:#76243a;--f3:#3d1020;--b1:#3a1420;--b2:#1c0a10}
body[data-felt=clar]{--f1:#f1e6cb;--f2:#dccba4;--f3:#bfa878;--b1:#4a3f2c;--b2:#2e2619}
body[data-felt=clar] .seat .nm2{color:#2a1a0a}
body[data-felt=clar] #msg{color:#fff}
body[data-back=rajola] .seat .mini,body[data-back=rajola] .flyback{background:var(--tile) !important;background-size:13px 13px !important}
body[data-back=sobri] .seat .mini,body[data-back=sobri] .flyback{background:repeating-linear-gradient(45deg,#4a0f1c 0 3px,#661a2b 3px 6px) !important}
body.big #hand{grid-template-columns:repeat(4,1fr);gap:7px}
.sc small{display:block;font-size:11px;opacity:.85;min-height:13px}
.sc.pulse{animation:pulse .55s}
@keyframes pulse{40%{transform:scale(1.18);background:#2ea44f}}
.fp{position:fixed;z-index:9;pointer-events:none;font-weight:900;font-size:26px;color:#ffe08a;text-shadow:0 2px 0 #7a1010,0 0 10px #000}
.card.star::after{content:'★';position:absolute;top:-9px;right:-5px;width:20px;height:20px;line-height:20px;text-align:center;font-size:13px;border-radius:50%;background:var(--gold);color:#7a1010;box-shadow:0 1px 4px #000a;z-index:3}
#lastbtn{position:absolute;left:0;bottom:0;z-index:3;width:46px;padding:4px 0;border:0;border-radius:10px;background:#0008;color:#fff;font-size:11px;line-height:1.15}
#ov .btn.sec2{background:#0001;color:#222;border:1px solid #b9a97a}
#ov .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
#ov .row .btn{margin:0}
.sum{width:100%;border-collapse:collapse;margin:6px 0}
.sum td,.sum th{padding:5px 6px;border-bottom:1px solid #d8cba5;text-align:right}
.sum td:first-child,.sum th:first-child{text-align:left}
.sum tr.tot td{font-weight:800;border-top:2px solid #2a1a0a}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 0}
.seg{display:flex;border:1px solid #b9a97a;border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fffaf0;padding:8px 10px;font-size:13px;color:#222}
.seg button.on{background:#c8102e;color:#fff;font-weight:700}
.trow{display:flex;gap:6px;align-items:center;margin:7px 0}
.trow .tn{width:16px;font-weight:700}
.tc{width:52px;text-align:center}
.tc .mc{line-height:0;border-radius:7px}
.tc.w .mc{box-shadow:0 0 0 3px #2ea44f}
.tc small{font-size:10px;color:#444;display:block;margin-top:2px}
.trow.big .tc{width:66px}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3a6"/><stop offset=".5" stop-color="#f2c230"/><stop offset="1" stop-color="#a87206"/></linearGradient>
<linearGradient id="gCoinRim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset=".55" stop-color="#e0a820"/><stop offset="1" stop-color="#8a5a00"/></linearGradient>
<radialGradient id="gCoin" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff6c2"/><stop offset=".5" stop-color="#f6d45a"/><stop offset="1" stop-color="#d49a18"/></radialGradient>
<linearGradient id="gCup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a68"/><stop offset=".5" stop-color="#e65a2c"/><stop offset="1" stop-color="#962610"/></linearGradient>
<linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4fbff"/><stop offset=".5" stop-color="#9ad2f2"/><stop offset="1" stop-color="#4a82b4"/></linearGradient>
<linearGradient id="gClub" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4ec7a"/><stop offset=".5" stop-color="#8cc63f"/><stop offset="1" stop-color="#4a8420"/></linearGradient>
<radialGradient id="gSkin" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffe6c6"/><stop offset=".6" stop-color="#f2c999"/><stop offset="1" stop-color="#d8a070"/></radialGradient>
<linearGradient id="gPaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffefb"/><stop offset="1" stop-color="#f4ecd6"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b57"/><stop offset=".5" stop-color="#d6252b"/><stop offset="1" stop-color="#8c0f18"/></linearGradient>
<linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aa0ea"/><stop offset=".5" stop-color="#2d63b8"/><stop offset="1" stop-color="#163a7a"/></linearGradient>
<linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#68cc82"/><stop offset=".5" stop-color="#2f8f4e"/><stop offset="1" stop-color="#17542c"/></linearGradient>
<linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8fff0"/><stop offset=".4" stop-color="#9fdcae"/><stop offset="1" stop-color="#4f9a66"/></linearGradient>
<linearGradient id="gSausage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6866e"/><stop offset=".5" stop-color="#b5483a"/><stop offset="1" stop-color="#6e1f18"/></linearGradient>
</defs></svg>
<div id="app">
  <div class="senyera"></div>
  <header>
    <div class="sc" id="scus">Nosaltres<b id="sc-us">0</b><small id="hp-us"></small></div>
    <div class="mid"><div class="ttl2">Butifarra</div><div class="tr" id="trump">—</div></div>
    <div class="sc" id="scthem">Ells<b id="sc-them">0</b><small id="hp-them"></small></div>
    <button class="ibtn" id="menu">☰</button>
  </header>

  <div id="frame"><div id="table">
    <div class="seat top" id="seat2"><span class="nm2">Montse (company)</span><div class="mini" id="n2"></div></div>
    <div class="seat left" id="seat3"><span class="nm2">Jordi</span><div class="mini" id="n3"></div></div>
    <div id="center">
      <div class="slot" id="c0"></div><div class="slot" id="c1"></div>
      <div class="slot" id="c2"></div><div class="slot" id="c3"></div>
    </div>
    <div class="seat right" id="seat1"><span class="nm2">Pere</span><div class="mini" id="n1"></div></div>
  </div></div>

  <div id="msg"></div>
  <div id="actions"></div>
  <div id="hand"></div>
</div>

/* ---------- regles ---------- */
function beats(a,b,trump){            // la carta a guanya a la carta b (que va guanyant la basa)?
  const ta=a.s===trump, tb=b.s===trump;
  if(ta&&!tb)return true;
  if(!ta&&tb)return false;
  if(a.s===b.s)return str(a)>str(b);
  return false;
}
function winnerOf(trick,trump){
  let best=trick[0];
  for(let i=1;i<trick.length;i++) if(beats(trick[i].card,best.card,trump)) best=trick[i];
  return best;
}
function legal(hand,trick,trump,seat){
  if(!trick.length)return hand.slice();
  const lead=trick[0].card.s, w=winnerOf(trick,trump), partnerWin=team(w.seat)===team(seat);
  const same=hand.filter(c=>c.s===lead);
  if(same.length){
    if(partnerWin)return same;
    const over=same.filter(c=>beats(c,w.card,trump));
    return over.length?over:same;
  }
  if(partnerWin)return hand.slice();
  const tr=hand.filter(c=>c.s===trump);
  if(tr.length){const over=tr.filter(c=>beats(c,w.card,trump));return over.length?over:tr}
  return hand.slice();
}
function explain(){
  const hand=G.hands[0],t=G.trick;
  if(!t.length)return 'Surts tu: pots jugar qualsevol carta.';
  const lead=t[0].card.s,w=winnerOf(t,G.trump),pw=team(w.seat)===0;
  const same=hand.filter(c=>c.s===lead);
  if(same.length){
    if(pw)return `Has de servir ${SUITN[lead]}. La teva company guanya: no cal superar.`;
    const over=same.filter(c=>beats(c,w.card,G.trump));
    return over.length?`Has de servir ${SUITN[lead]} i superar la carta que guanya (${NAMES[w.seat]}).`:`Has de servir ${SUITN[lead]}; no pots superar-la, juga'n la que vulguis.`;
  }
  if(pw)return `No tens ${SUITN[lead]} i guanya la teva company: pots jugar qualsevol carta.`;
  const tr=hand.filter(c=>c.s===G.trump);
  if(tr.length){
    const over=tr.filter(c=>beats(c,w.card,G.trump));
    return over.length?'No tens el pal: has de fallar amb triomf i sobrefallar.':'No tens el pal: has de fallar amb triomf (no pots sobrefallar).';
  }
  return `No tens ${SUITN[lead]} ni triomf: pots jugar qualsevol carta.`;
}

function suitVal(h,s){const cs=h.filter(c=>c.s===s);let v=cs.length*3;cs.forEach(c=>v+=str(c)*.8+pts(c));if(cs.some(c=>c.r===9))v+=4;return v}

function scoreDiff(seat){return team(seat)===0?S.us-S.them:S.them-S.us}

/* ---------- triomf ---------- */
function botChoose(seat,canPass){
  const h=G.hands[seat];
  let best=null,bs=-1;
  for(const s of SUITS){const v=suitVal(h,s);if(v>bs){bs=v;best=s}}
  const tops=h.filter(c=>c.r===9||c.r===1).length;
  const maxlen=Math.max(...SUITS.map(s=>h.filter(c=>c.s===s).length));
  const lv=CFG.level;
  if(lv==='expert'){
    try{return mcChoose(seat,canPass,0)}catch(e){}
  }
  if(tops>=4&&maxlen<=4)return 'B';
  if(canPass&&bs<(lv==='facil'?26:31))return 'pass';
  return best;
}
function chooseStage(seat,canPass){

function dblScore(s){

  if(CFG.level==='expert'){v+=sureTricks(h)*1.5;const d=scoreDiff(s);if(d<=-25)v+=3;if(d>=25)v-=3}
  return v;
}
function doubleStage(stage){
  if(stage==='sant'&&G.trump==='B')return startPlay();

  const yes=who=>{G.mult*=2;G.multLog.push(label+' ×2');sfx('contro');
    if(who===0&&!NET.started)say(`${label}! Els punts es multipliquen (x${G.mult}).`);

        netTo(x,{t:'ask',k:'dbl',label});

  }
  const seats=[0,1,2,3].filter(x=>team(x)===t&&!isHuman(x));
  const base=CFG.level==='expert'?{contrar:27,recontrar:27,sant:31}:{contrar:25,recontrar:25,sant:29};
  const thr=base[stage]+(CFG.level==='facil'?8:0);
  let who=null;
  for(const x of seats){if(dblScore(x)>=thr){who=x;break}}
  if(who!==null){say(`${NAMES[who]} diu «${label}»!`);G.mult*=2;G.multLog.push(label+' ×2');sfx('contro');render();later(()=>nextStage?doubleStage(nextStage):startPlay(),1200)}
  else startPlay();
}

function next(){

  if(G.turn===0){G.sug=null;if(CFG.help){const L=legal(G.hands[0],G.trick,G.trump,0);if(L.length>1){try{G.sug=mcPick(0,G.hands[0],L)}catch(e){}}}say(CFG.help?('Ajuda: '+explain()):'Et toca: tria una carta (les marcades són les permeses).',true);render();return}

  later(()=>botMove(G.turn),750);

function isMaster(c,hand){
  for(const r of ORDER){
    if(r===c.r)return true;
    if(!G.played.has(c.s+r)&&!hand.some(x=>x.s===c.s&&x.r===r))return false;
  }
  return true;
}
/* nivell mitjà */
function midPick(seat,hand,L){
  const low=a=>a.slice().sort((x,y)=>pts(x)-pts(y)||str(x)-str(y))[0];
  if(!G.trick.length){
    const masters=L.filter(c=>isMaster(c,hand));
    const nt=masters.filter(c=>c.s!==G.trump);
    if(nt.length)return nt.sort((a,b)=>pts(b)-pts(a))[0];
    if(masters.length)return masters.sort((a,b)=>pts(b)-pts(a))[0];
    const nonT=L.filter(c=>c.s!==G.trump);return low(nonT.length?nonT:L);
  }
  const w=winnerOf(G.trick,G.trump), partnerWin=team(w.seat)===team(seat);
  if(partnerWin)return L.slice().sort((a,b)=>pts(b)-pts(a)||str(a)-str(b))[0];
  const win=L.filter(c=>beats(c,w.card,G.trump));
  return win.length?win.sort((a,b)=>str(a)-str(b))[0]:low(L);
}
/* nivell expert: simulacions Montecarlo (cartes desconegudes repartides de manera coherent amb els buits) */
function unseenFor(seat){return ALL.filter(c=>!G.played.has(c.s+c.r)&&!G.hands[seat].some(h=>h.s===c.s&&h.r===c.r))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function doPlay(seat,c){
  if(G.trick.length){const lead=G.trick[0].card.s;if(c.s!==lead)G.void[seat][lead]=true}
  const h=G.hands[seat];h.splice(h.indexOf(c),1);G.trick.push({seat,card:c});G.played.add(c.s+c.r);
}
function playoutFrom(st,turn){
  const real=G;G=st;const r=[0,0];let t=turn;
  try{
    for(;;){
      while(G.trick.length<4){
        const h=G.hands[t],L=legal(h,G.trick,G.trump,t);
        const c=L.length===1?L[0]:midPick(t,h,L);
        doPlay(t,c);t=(t+1)%4;
      }
      const w=winnerOf(G.trick,G.trump);let tp=1;for(const x of G.trick)tp+=pts(x.card);
      r[team(w.seat)]+=tp;t=w.seat;G.trick=[];
      if(G.hands[t].length===0)break;
    }
  }finally{G=real}
  return r;
}
function determinize(seat,U,sizes){
  const others=[0,1,2,3].filter(s=>s!==seat);
  for(let attempt=0;attempt<25;attempt++){
    const pool=shuffle(U.slice()),hs=[[],[],[],[]];let ok=true;
    for(const c of pool){
      const el=others.filter(o=>hs[o].length<sizes[o]&&!G.void[o][c.s]);
      if(!el.length){ok=false;break}
      let tot=0;for(const o of el)tot+=sizes[o]-hs[o].length;
      let r=Math.random()*tot,pick=el[0];
      for(const o of el){r-=sizes[o]-hs[o].length;if(r<=0){pick=o;break}}
      hs[pick].push(c);
    }
    if(ok)return hs;
  }
  const pool=shuffle(U.slice()),hs=[[],[],[],[]];
  for(const o of others)hs[o]=pool.splice(0,sizes[o]);
  return hs;
}
function mcPick(seat,hand,L,budget){
  if(L.length===1)return L[0];
  const real=G,U=unseenFor(seat);
  const sizes=[0,1,2,3].map(s=>s===seat?0:real.hands[s].length);
  const K=Math.max(8,Math.min(48,Math.floor((budget||360)/L.length)));
  const sc=L.map(()=>0),me=team(seat),t0=performance.now();
  for(let k=0;k<K;k++){
    if(k>=4&&performance.now()-t0>380)break;
    const hs=determinize(seat,U,sizes);
    for(let i=0;i<L.length;i++){
      const st={hands:hs.map(h=>h.slice()),trick:real.trick.slice(),played:new Set(real.played),void:real.void.map(v=>Object.assign({},v)),trump:real.trump,chooser:real.chooser};
      st.hands[seat]=hand.slice();
      G=st;doPlay(seat,L[i]);G=real;
      const r=playoutFrom(st,(seat+1)%4);
      sc[i]+=r[me]-r[1-me];
    }
  }
  let bi=0;for(let i=1;i<L.length;i++)if(sc[i]>sc[bi])bi=i;
  return L[bi];
}
function mcChoose(seat,canPass,thr){
  const real=G,h=real.hands[seat],opts=SUITS.concat(['B']);
  const U=ALL.filter(c=>!h.some(x=>x.s===c.s&&x.r===c.r));
  let KK=0;const K=40,me=team(seat),sc={};opts.forEach(o=>sc[o]=0);
  const first=((real.dealer==null?0:real.dealer)+1)%4;
  const t1=performance.now();
  for(let k=0;k<K;k++){
    if(k>=8&&performance.now()-t1>450)break;
    const pool=shuffle(U.slice()),hs=[[],[],[],[]];
    for(let s=0;s<4;s++)hs[s]=s===seat?h.slice():pool.splice(0,12);
    for(const o of opts){
      const st={hands:hs.map(x=>x.slice()),trick:[],played:new Set(),void:[{},{},{},{}],trump:o,chooser:seat};
      const r=playoutFrom(st,first);
      sc[o]+=(r[me]-36)*(o==='B'?2:1);
    }
    KK++;
  }
  let best=opts[0];for(const o of opts)if(sc[o]>sc[best])best=o;
  const avg=sc[best]/Math.max(1,KK);
  if(canPass&&avg<(thr==null?0:thr))return 'pass';
  return best;
}

function botMove(seat){
  const hand=G.hands[seat], L=legal(hand,G.trick,G.trump,seat);
  let pick;
  if(CFG.level==='expert'){try{pick=mcPick(seat,hand,L)}catch(e){pick=midPick(seat,hand,L)}}
  else if(CFG.level==='facil'&&Math.random()<.45)pick=L[Math.floor(Math.random()*L.length)];
  else pick=midPick(seat,hand,L);
  play(seat,pick);
}
function humanPlay(c){
  if(G.phase!=='play'||G.turn!==0||G.busy)return;
  if(!legal(G.hands[0],G.trick,G.trump,0).includes(c))return;
  if(G.net){if(G.pend)return;G.pend=true;G.sel=null;netSend({t:'play',s:c.s,r:c.r});return}
  play(0,c);
}
function play(seat,card){
  if(seat===0){G.sel=null;hidePreview()}
  if(G.trick.length){const lead=G.trick[0].card.s;if(card.s!==lead)G.void[seat][lead]=true}
  const h=G.hands[seat];h.splice(h.indexOf(card),1);
  G.trick.push({seat,card});G.played.add(card.s+card.r);
  sfx('play');
  if(G.trick.length===4){G.busy=true;render();later(resolveTrick,1300)}
  else{G.turn=(seat+1)%4;render();next()}
}
function floatPts(n,t){

function sweepAnim(ws){

function resolveTrick(){
  const w=winnerOf(G.trick,G.trump), t=team(w.seat);
  const tp=G.trick.reduce((a,x)=>a+pts(x.card),0)+1;
  const copy=G.trick.map(x=>({seat:x.seat,card:x.card}));

  },720);
}

function endHand(){
  G.phase='end';
  const p=[G.cardPts[0]+G.tricks[0],G.cardPts[1]+G.tricks[1]];
  const diff=Math.abs(p[0]-36), gain=diff*G.mult;

  const info={kind,gain,over,cp:G.cardPts.slice(),tr:G.tricks.slice(),p,mult:G.mult,ml:G.multLog.slice(),S:{us:S.us,them:S.them}};
  showSummary(info,false);

}

/* --- amfitrió --- */
function code5(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function lobbyNames(){return [0,1,2,3].map(i=>i===0||NET.conns[i]?NET.names[i]:null)}
function hostCreate(){
  const hn=NET.names[0];netReset(true);GEN++;NET.names[0]=hn;
  NET.role='host';NET.status='Creant la sala…';openOnline();
  let tries=0;
  const make=()=>{
    const code=code5();
    let p;try{p=new Peer('butifarra-'+code,window.PEER_OPTS)}catch(e){NET.status='No es pot iniciar la xarxa en aquest navegador.';openOnline();return}
    NET.peer=p;
    p.on('open',()=>{NET.code=code;NET.status='';openOnline()});
    p.on('error',e=>{
      if(e.type==='unavailable-id'&&tries++<5){try{p.destroy()}catch(_){}make();return}
      NET.status='Error de xarxa ('+e.type+'). Torna-ho a provar.';openOnline();
    });
    p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
    p.on('connection',conn=>{
      conn.on('data',m=>hostMsg(conn,m));
      conn.on('close',()=>hostLeft(conn));
      conn.on('error',()=>{});
    });
  };
  make();
}
function hostMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='hello'){
    if(NET.started){conn.send({t:'denied',why:'La partida ja ha començat.'});return}
    const seat=[2,1,3].find(s=>!NET.conns[s]);
    if(!seat){conn.send({t:'denied',why:'La sala és plena.'});return}
    NET.conns[seat]=conn;conn.__seat=seat;NET.names[seat]=String(m.name||'Amic').slice(0,14);
    conn.send({t:'welcome',seat});
    netAll(()=>({t:'lobby',names:lobbyNames()}));
    if(!NET.started)openOnline();
    return;
  }
  const seat=conn.__seat;if(!seat||NET.conns[seat]!==conn||!NET.started||!G)return;
  const w=NET.wait;
  if(m.t==='play'){
    if(G.phase!=='play'||G.turn!==seat||G.busy)return;
    const c=G.hands[seat].find(x=>x.s===m.s&&x.r===m.r);
    if(!c||!legal(G.hands[seat],G.trick,G.trump,seat).includes(c))return;
    NET.wait=null;play(seat,c);
  }else if(m.t==='trump'&&w&&w.k==='choose'&&w.seat===seat&&!G.trump){
    if(!(m.v==='B'||SUITS.includes(m.v)))return;
    NET.wait=null;setTrump(m.v,seat);
  }else if(m.t==='pass'&&w&&w.k==='choose'&&w.seat===seat&&w.canPass&&!G.trump){
    NET.wait=null;say(`${NAMES[seat]} passa.`);later(()=>chooseStage((seat+2)%4,false),900);
  }else if(m.t==='dbl'&&w&&w.k==='dbl'&&w.seat===seat){
    NET.wait=null;m.v?w.yes():w.no();
  }
}
function hostLeft(conn){
  const seat=conn.__seat;if(!seat||NET.conns[seat]!==conn)return;
  const nm=NET.names[seat];
  delete NET.conns[seat];NET.names[seat]=DEFN[seat];
  if(NET.started){
    NAMES[seat]=DEFN[seat];setLabels();
    say(`${nm} ha marxat. El substitueix ${DEFN[seat]} (bot).`);
    const w=NET.wait;if(w&&w.seat===seat){NET.wait=null;w.retry()}
    else render();
  }else{netAll(()=>({t:'lobby',names:lobbyNames()}));openOnline()}
}
function hostStart(){
  NET.started=true;
  for(let i=1;i<=3;i++)NAMES[i]=NET.names[i];
  setLabels();closeOv();newMatch();
}
/* --- convidat --- */
function guestJoin(code,name){
  netReset(true);GEN++;
  NET.role='guest';NET.code=code.toUpperCase().replace(/[^A-Z0-9]/g,'');NET.status='Connectant…';openOnline();
  let p;try{p=new Peer(window.PEER_OPTS)}catch(e){NET.status='No es pot iniciar la xarxa en aquest navegador.';openOnline();return}
  NET.peer=p;
  const fail=t=>{NET.status=t;if(!G||!G.net)openOnline()};
  const to=setTimeout(()=>{if(!NET.conn||!NET.conn.open){fail('No s\'ha pogut connectar. Comprova el codi i la xarxa.');}},15000);
  p.on('error',e=>fail(e.type==='peer-unavailable'?'No trobo aquesta sala. Comprova el codi (l\'amfitrió ha de tenir la sala oberta).':'Error de xarxa ('+e.type+').'));
  p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
  p.on('open',()=>{
    const c=p.connect('butifarra-'+NET.code,{reliable:true});
    NET.conn=c;
    c.on('open',()=>{clearTimeout(to);c.send({t:'hello',name});NET.status='Connectat. Esperant que l\'amfitrió comenci…';openOnline()});
    c.on('data',guestMsg);
    c.on('close',()=>{if(NET.role==='guest'){guestGone('L\'amfitrió s\'ha desconnectat.')}});
    c.on('error',()=>{});
  });
}

}
function netSend(m){if(NET.conn&&NET.conn.open)try{NET.conn.send(m)}catch(e){}}
function guestMsg(m){
  if(!m||typeof m!=='object')return;
  if(m.t==='denied'){NET.status=m.why;try{NET.peer.destroy()}catch(e){}NET.role=null;openOnline()}
  else if(m.t==='welcome'){NET.seat=m.seat}
  else if(m.t==='lobby'){NET.lobby=m.names;if(!G||!G.net)openOnline()}
  else if(m.t==='view')guestApply(m.v);

}
function guestApply(v){
  const nw=!G||!G.net||G.hid!==v.hid;
  if(nw){
    GEN++;
    G={net:true,hid:v.hid,shown:new Set(),handAnimated:false,dealing:true,sel:null,sug:null,void:[{},{},{},{}],played:new Set()};
    closeOv();hidePreview();setActions('',[]);
    for(let j=0;j<4;j++)NAMES[j]=j===0?'Tu':v.names[(v.me+j)%4];
    setLabels();
    const h=v.hid;setTimeout(()=>{if(G&&G.hid===h)G.dealing=false},2900);
  }
  const sel=G.sel?{s:G.sel.s,r:G.sel.r}:null;
  const keep={shown:G.shown,handAnimated:G.handAnimated,dealing:G.dealing,void:G.void,played:G.played,fromRect:G.fromRect,sumHTML:G.sumHTML};
  Object.assign(G,v,keep);
  S={us:v.S.us,them:v.S.them};
  G.sel=sel?G.hands[0].find(c=>c.s===sel.s&&c.r===sel.r)||null:null;
  G.pend=false;
  render();
  if(nw)dealAnim(v.dealer);
  if(G.phase==='play'&&G.turn===0&&!G.busy)$('msg').textContent=CFG.help?('Ajuda: '+explain()):'Et toca: tria una carta (les marcades són les permeses).';
}
function guestAsk(m){
  if(m.k==='choose'){
    const b=SUITS.map(s=>({label:ICON[s]+SUITN[s],fn:()=>{setActions('',[]);netSend({t:'trump',v:s})}}));
    b.push({label:'Butifarra',fn:()=>{setActions('',[]);netSend({t:'trump',v:'B'})}});
    if(m.canPass)b.push({label:'Passo',sec:true,fn:()=>{setActions('',[]);netSend({t:'pass'})}});
    setActions(m.canPass?'Tria el triomf o passa':'Has de triar el triomf',b);
    $('msg').textContent=m.canPass?'Et toca triar el triomf.':'La teva company ha passat: tria tu.';
  }else if(m.k==='dbl'){
    $('msg').textContent=`Vols dir «${m.label}»?`;
    setActions(m.label+'?',[{label:m.label+'!',fn:()=>{setActions('',[]);netSend({t:'dbl',v:true})}},{label:'No',sec:true,fn:()=>{setActions('',[]);netSend({t:'dbl',v:false})}}]);
  }
}
function netReset(keepNames){
  try{if(NET.peer)NET.peer.destroy()}catch(e){}
  NET.role=null;NET.conns={};NET.started=false;NET.wait=null;NET.peer=null;NET.code=null;NET.seat=null;NET.lobby=null;NET.conn=null;NET.status='';
  NET.names=DEFN.slice();
  for(let i=0;i<4;i++)NAMES[i]=DEFN[i];setLabels();
}
/* --- pantalla de sala --- */
function inviteURL(){return location.href.split('#')[0].split('?')[0]+'?sala='+NET.code}
function openOnline(){
  if(!NET.role){
    openOv(`<h2>Jugar en línia</h2>
    <p><small>Convida amics: tu crees una sala i els passes l'enllaç. Els seients buits els ocupen bots.</small></p>
    <div class="opt"><span>El teu nom</span><input id="nm" maxlength="14" value="${(CFG.name||'').replace(/"/g,'')}" placeholder="Nom" style="width:55%;padding:8px;border-radius:8px;border:0;font-size:15px"></div>
    <div class="row"><button class="btn" id="mk">Crear sala</button></div>
    <div class="opt"><span>Codi de sala</span><input id="cd" maxlength="5" placeholder="XXXXX" style="width:40%;padding:8px;border-radius:8px;border:0;font-size:15px;text-transform:uppercase"></div>
    ${NET.status?`<p><b>${NET.status}</b></p>`:''}
    <div class="row"><button class="btn sec2" id="jn">Entrar a una sala</button><button class="btn sec2" id="bk">Enrere</button></div>`);
    const nm=()=>{const v=($('nm').value||'').trim()||'Amic';CFG.name=v;saveJ('but.cfg',CFG);return v};
    $('mk').onclick=()=>{NET.names[0]=nm();hostCreate()};
    $('jn').onclick=()=>{const c=($('cd').value||'').trim();if(c.length<4)return;guestJoin(c,nm())};
    $('bk').onclick=openMenu;
    return;
  }
  const rows=nms=>[0,2,1,3].map(i=>{const lbl=i===0?'Amfitrió':i===2?'Company':'Rival';const n=nms[i];return `<tr><td>${lbl}</td><td>${n?'<b>'+n.replace(/</g,'&lt;')+'</b>':'<i>bot</i>'}</td></tr>`}).join('');
  if(NET.role==='host'){
    if(!NET.code){openOv(`<h2>Sala</h2><p>${NET.status||'…'}</p><div class="row"><button class="btn sec2" id="bk">Enrere</button></div>`);$('bk').onclick=()=>{netReset();openOnline()};return}
    const url=inviteURL();
    openOv(`<h2>Sala ${NET.code}</h2>
    <p><small>Envia aquest enllaç als amics. Han d'obrir-lo amb el navegador del mòbil mentre tu tens la sala oberta.</small></p>
    <div class="row"><button class="btn" id="sh">Convida amics</button></div>
    <input id="lk" readonly value="${url}" style="width:100%;padding:8px;border-radius:8px;border:0;font-size:12px;margin:6px 0">
    <table class="sum">${rows(lobbyNames())}</table>
    ${NET.started?'<p><small>Partida en marxa.</small></p>':''}
    <div class="row">${NET.started?'<button class="btn" id="cl2">Tanca</button>':'<button class="btn" id="go2">Comença la partida</button>'}<button class="btn sec2" id="ex">Tanca la sala</button></div>`);
    $('sh').onclick=()=>{
      const text=`Vine a jugar a la butifarra! Codi de sala: ${NET.code}`;
      if(navigator.share)navigator.share({title:'Butifarra',text,url}).catch(()=>{});
      else{try{navigator.clipboard.writeText(url);$('sh').textContent='Enllaç copiat'}catch(e){$('lk').select()}}
    };
    $('lk').onclick=()=>$('lk').select();
    if($('go2'))$('go2').onclick=hostStart;
    if($('cl2'))$('cl2').onclick=closeOv;
    $('ex').onclick=()=>{netReset();closeOv();newMatch()};
  }else{
    const ln=NET.lobby;
    openOv(`<h2>Sala ${NET.code||''}</h2><p>${NET.status||''}</p>${ln?`<table class="sum">${rows(ln)}</table>`:''}
    <div class="row"><button class="btn sec2" id="ex">Surt</button></div>`);
    $('ex').onclick=()=>{netReset();closeOv();newMatch()};
  }
}
window.addEventListener('pagehide',()=>{try{if(NET.conn)NET.conn.close()}catch(e){}});
document.addEventListener('visibilitychange',()=>{try{if(!document.hidden&&NET.peer&&NET.peer.disconnected&&!NET.peer.destroyed)NET.peer.reconnect()}catch(e){}});

$('menu').onclick=openMenu;
$('center').insertAdjacentHTML('beforeend','<button id="lastbtn" style="display:none">↺<br>Última</button>');
$('lastbtn').onclick=openLast;
newMatch();
{const c=new URLSearchParams(location.search).get('sala');if(c){NET.status='';openOv(`<h2>Entrar a la sala ${c.toUpperCase().replace(/[^A-Z0-9]/g,'')}</h2><p><small>Un amic t'ha convidat a jugar a la butifarra.</small></p><div class="opt"><span>El teu nom</span><input id="nm" maxlength="14" value="${(CFG.name||'').replace(/"/g,'')}" placeholder="Nom" style="width:55%;padding:8px;border-radius:8px;border:0;font-size:15px"></div><div class="row"><button class="btn" id="jn">Entrar</button><button class="btn sec2" id="no">Ara no</button></div>`);$('jn').onclick=()=>{const v=($('nm').value||'').trim()||'Amic';CFG.name=v;saveJ('but.cfg',CFG);guestJoin(c,v)};$('no').onclick=closeOv}}
</script>
